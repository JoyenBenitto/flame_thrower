[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flame_thrower"
version = "0.0.1"
description = "Flame Thrower"
readme = "README.adoc"
authors = [
    {name = "Joyen Benitto", email = "joyen.benitto12@gmail.com"}
]
license = {text = "MIT"}

classifiers = [
    "Programming Language :: Python :: 3.10",
    "License :: MIT",
    "Development Status :: 4 - Beta"
]

keywords = ["flame_thrower"]
requires-python = ">=3.10"
dependencies = [
    "click==8.1.7",
    "ruamel.yaml==0.17.40",
    "cerberus==1.3.4",
    "colorlog>=5.0.0",
    "jinja2==3.1.6",
]

[project.urls]
Homepage = "https://github.com/JoyenBenitto/flame_thrower/"

[project.scripts]
flame_thrower = "flame_thrower.main:cli"

[tool.setuptools]
package-dir = {"flame_thrower" = "flame_thrower"}
package-data = {"flame_thrower" = ["constants/**/*"]}
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["flame_thrower*"]
